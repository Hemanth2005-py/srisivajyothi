server:
  port: ${PORT:8080}
  compression:
    enabled: true

spring:
  application:
    name: mymart-backend
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/mymart}}
      auto-index-creation: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  web:
    resources:
      static-locations: file:./frontend/,classpath:/static/

firebase:
  enabled: ${FIREBASE_ENABLED:true}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  credentials-json: ${FIREBASE_CREDENTIALS_JSON:}
  project-id: ${FIREBASE_PROJECT_ID:mymart-app}

app:
  jwt:
    secret: ${JWT_SECRET:MymartSecretKeySupermarketEcommerceSecureKey2026SuperSecureKey}
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173,*}
  delivery:
    free-delivery-threshold: 299.0
    standard-fee: 35.0
    tax-rate: 0.05 # 5% GST on packaged food & grocery

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
