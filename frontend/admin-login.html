<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login — MYMART</title>
  <meta name="description" content="Secure administrative sign in for MYMART operations and inventory management.">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom Design System -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column justify-content-center align-items-center py-5" style="background: #0f172a;">

  <div class="container" style="max-width: 440px;">
    <!-- Brand Header -->
    <div class="text-center mb-4">
      <div class="d-inline-flex p-3 rounded-4 mb-2 shadow" style="background: rgba(12, 131, 31, 0.2); border: 1px solid #0c831f;">
        <i class="bi bi-shield-lock-fill text-success fs-1"></i>
      </div>
      <h2 class="fw-bold text-white mb-1">MYMART Operations</h2>
      <p class="text-secondary small">Supermarket Administration & Stock Portal</p>
    </div>

    <!-- Login Card -->
    <div class="card border-0 shadow-lg rounded-4 overflow-hidden p-4" style="background: #1e293b; border: 1px solid #334155 !important;">
      <form id="admin-login-form" onsubmit="AdminLogin.submit(event)">
        <div class="mb-3">
          <label class="form-label small fw-bold text-light">Admin Email or Username</label>
          <div class="input-group">
            <span class="input-group-text border-0" style="background: #0f172a; color: #94a3b8;"><i class="bi bi-person-fill"></i></span>
            <input type="text" id="admin-user" class="form-control border-0" style="background: #0f172a; color: #fff;" required placeholder="Enter admin email or username">
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-bold text-light">Secret Password</label>
          <div class="input-group">
            <span class="input-group-text border-0" style="background: #0f172a; color: #94a3b8;"><i class="bi bi-key-fill"></i></span>
            <input type="password" id="admin-pass" class="form-control border-0" style="background: #0f172a; color: #fff;" required placeholder="••••••••">
          </div>
        </div>

        <button type="submit" class="btn btn-primary-custom w-100 justify-content-center py-2 mb-3 shadow" id="btn-admin-submit">
          <i class="bi bi-unlock-fill me-2"></i> Enter Admin Dashboard
        </button>
      </form>
    </div>

    <div class="text-center mt-4 small text-secondary">
      <a href="index.html" class="text-secondary text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Back to Customer Store</a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/ui.js"></script>

  <script>
    const AdminLogin = {
      async submit(e) {
        e.preventDefault();
        const btn = document.getElementById('btn-admin-submit');
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Authenticating...`;

        const user = document.getElementById('admin-user').value.trim();
        const pass = document.getElementById('admin-pass').value;

        try {
          const loggedUser = await Auth.login(user, pass);
          if (loggedUser.role !== 'ROLE_ADMIN') {
            Auth.logout(false);
            throw new Error('Access denied: You do not possess administrative privileges.');
          }

          UI.showToast('Admin authenticated successfully.', 'success');
          setTimeout(() => window.location.href = 'admin-dashboard.html', 500);
        } catch (err) {
          UI.showToast(err.message, 'error');
          btn.disabled = false;
          btn.innerHTML = `<i class="bi bi-unlock-fill me-2"></i> Enter Admin Dashboard`;
        }
      }
    };
  </script>
</body>
</html>
