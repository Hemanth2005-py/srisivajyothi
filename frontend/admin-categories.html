<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category Management — MYMART Admin</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom Design System -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Admin Sidebar -->
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="brand-logo mb-4 px-2">
      <span style="display:inline-flex; width:34px; height:34px; border-radius:10px; background:#0c831f; color:#fff; align-items:center; justify-content:center; font-size:1.1rem;">
        <i class="bi bi-shield-lock-fill"></i>
      </span>
      <span>MYMART</span>
      <span class="badge bg-danger ms-auto" style="font-size:0.65rem;">ADMIN</span>
    </div>

    <nav class="d-flex flex-column gap-1 flex-grow-1">
      <a href="admin-dashboard.html" class="admin-nav-item"><i class="bi bi-speedometer2"></i> Overview</a>
      <a href="admin-products.html" class="admin-nav-item"><i class="bi bi-box-seam"></i> Products Catalog</a>
      <a href="admin-categories.html" class="admin-nav-item active"><i class="bi bi-tags"></i> Categories</a>
      <a href="admin-brands.html" class="admin-nav-item"><i class="bi bi-patch-check"></i> Brands</a>
      <a href="admin-orders.html" class="admin-nav-item"><i class="bi bi-receipt"></i> Orders Management</a>
      <a href="admin-inventory.html" class="admin-nav-item"><i class="bi bi-boxes"></i> Inventory Stock</a>
      <a href="admin-reports.html" class="admin-nav-item"><i class="bi bi-file-earmark-bar-graph"></i> Reports & Downloads</a>
      <a href="index.html" class="admin-nav-item text-primary"><i class="bi bi-shop"></i> View Live Store</a>
    </nav>

    <div class="pt-3 border-top">
      <div class="d-flex align-items-center justify-content-between px-2 mb-2">
        <small class="text-muted">Night Theme</small>
        <button class="btn btn-sm btn-link p-0 text-muted" onclick="UI.toggleTheme()" title="Toggle Dark/Light Mode"><i class="theme-toggle-icon bi bi-moon-stars-fill fs-5"></i></button>
      </div>
      <button class="btn btn-outline-danger btn-sm w-100" onclick="Auth.logout()"><i class="bi bi-box-arrow-right me-1"></i> Sign Out</button>
    </div>
  </aside>

  <!-- Admin Main Content -->
  <div class="admin-main-content">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
      <div>
        <h2 class="h4 fw-bold mb-0">Supermarket Categories</h2>
        <small class="text-muted">Manage product departments and homepage banners</small>
      </div>
      <button class="btn btn-primary-custom" onclick="AdminCategories.openAddModal()">
        <i class="bi bi-plus-lg me-1"></i> Add Category
      </button>
    </div>

    <!-- Categories Table -->
    <div class="custom-table-container">
      <div class="table-responsive">
        <table class="table custom-table mb-0">
          <thead>
            <tr>
              <th>Image</th>
              <th>Category Name</th>
              <th>Description</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="categories-tbody">
            <tr><td colspan="5" class="text-center py-4 text-muted">Loading categories...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Category Modal -->
  <div class="modal fade" id="categoryModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow rounded-4" style="background: var(--bg-surface);">
        <div class="modal-header border-bottom p-3">
          <h5 class="modal-title fw-bold" id="catModalTitle">Add Category</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <form id="category-form" onsubmit="AdminCategories.saveCategory(event)">
            <input type="hidden" id="edit-cat-id">

            <div class="mb-3">
              <label class="form-label small fw-bold">Category Name *</label>
              <input type="text" id="cat-name" class="form-control" required placeholder="e.g. Dairy, Bread and Eggs">
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Description</label>
              <textarea id="cat-desc" class="form-control" rows="2" placeholder="Brief description"></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Image URL *</label>
              <input type="url" id="cat-image" class="form-control" required placeholder="https://images.unsplash.com/...">
            </div>

            <div class="form-check form-switch mb-3">
              <input class="form-check-input" type="checkbox" id="cat-active" checked>
              <label class="form-check-label small" for="cat-active">Active</label>
            </div>

            <div class="text-end">
              <button type="button" class="btn btn-outline-secondary me-2" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary-custom">Save</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>

  <script>
    const AdminCategories = {
      categories: [],

      async init() {
        UI.initTheme();
        if (!Auth.requireAdmin()) return;
        await this.load();
      },

      async load() {
        try {
          this.categories = await API.get('/admin/categories');
          const tbody = document.getElementById('categories-tbody');
          if (this.categories.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted">No categories created yet.</td></tr>`;
            return;
          }

          tbody.innerHTML = this.categories.map(c => `
            <tr>
              <td>
                <img src="${c.imageUrl || 'https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=100&q=80'}"
                     style="width: 44px; height: 44px; object-fit: cover; border-radius: 8px;">
              </td>
              <td class="fw-bold">${c.name}</td>
              <td class="text-muted small">${c.description || '-'}</td>
              <td><span class="badge ${c.active ? 'bg-success' : 'bg-secondary'}">${c.active ? 'Active' : 'Inactive'}</span></td>
              <td>
                <button class="btn btn-sm btn-outline-primary me-1" onclick="AdminCategories.openEditModal('${c.id}')"><i class="bi bi-pencil"></i></button>
                <button class="btn btn-sm btn-outline-danger" onclick="AdminCategories.deleteCategory('${c.id}')"><i class="bi bi-trash"></i></button>
              </td>
            </tr>
          `).join('');
        } catch (err) {
          console.error(err);
        }
      },

      openAddModal() {
        document.getElementById('catModalTitle').textContent = 'Add Category';
        document.getElementById('edit-cat-id').value = '';
        document.getElementById('category-form').reset();
        new bootstrap.Modal(document.getElementById('categoryModal')).show();
      },

      openEditModal(id) {
        const c = this.categories.find(x => x.id === id);
        if (!c) return;

        document.getElementById('catModalTitle').textContent = 'Edit Category';
        document.getElementById('edit-cat-id').value = c.id;
        document.getElementById('cat-name').value = c.name;
        document.getElementById('cat-desc').value = c.description || '';
        document.getElementById('cat-image').value = c.imageUrl || '';
        document.getElementById('cat-active').checked = c.active;
        new bootstrap.Modal(document.getElementById('categoryModal')).show();
      },

      async saveCategory(e) {
        e.preventDefault();
        const id = document.getElementById('edit-cat-id').value;
        const data = {
          name: document.getElementById('cat-name').value.trim(),
          description: document.getElementById('cat-desc').value.trim(),
          imageUrl: document.getElementById('cat-image').value.trim(),
          active: document.getElementById('cat-active').checked
        };

        try {
          if (id) {
            await API.put(`/admin/categories/${id}`, data);
            UI.showToast('Category updated', 'success');
          } else {
            await API.post('/admin/categories', data);
            UI.showToast('Category created', 'success');
          }
          bootstrap.Modal.getInstance(document.getElementById('categoryModal')).hide();
          await this.load();
        } catch (err) {
          UI.showToast(err.message, 'error');
        }
      },

      async deleteCategory(id) {
        if (confirm('Delete or deactivate this category?')) {
          try {
            await API.delete(`/admin/categories/${id}`);
            UI.showToast('Category updated', 'info');
            await this.load();
          } catch (err) {
            UI.showToast(err.message, 'error');
          }
        }
      }
    };

    document.addEventListener('DOMContentLoaded', () => AdminCategories.init());
  </script>
</body>
</html>
