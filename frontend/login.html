<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login & Registration — MYMART</title>
  <meta name="description" content="Sign in or register for your MYMART supermarket customer account.">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom Design System -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column justify-content-center align-items-center py-5">

  <div class="container" style="max-width: 460px;">
    <!-- Logo Header -->
    <div class="text-center mb-4">
      <a href="index.html" class="brand-logo justify-content-center mb-2">
        <span style="display:inline-flex; width:40px; height:40px; border-radius:12px; background:#0c831f; color:#fff; align-items:center; justify-content:center; font-size:1.3rem;">
          <i class="bi bi-basket-fill"></i>
        </span>
        <span class="fs-2">MYMART</span>
      </a>
      <p class="text-muted small">Your 10-Minute Supermarket Grocery Delivery</p>
    </div>

    <!-- Auth Card -->
    <div class="card border-0 shadow-lg rounded-4 overflow-hidden" style="background: var(--bg-surface); border: 1px solid var(--border-color) !important;">
      <!-- Nav Tabs -->
      <ul class="nav nav-pills nav-fill p-2 bg-light border-bottom" id="authTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active fw-bold py-2" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-pane" type="button">Customer Login</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link fw-bold py-2" id="register-tab" data-bs-toggle="pill" data-bs-target="#register-pane" type="button">Register</button>
        </li>
      </ul>

      <div class="tab-content p-4" id="authTabsContent">
        <!-- Login Form Pane -->
        <div class="tab-pane fade show active" id="login-pane" role="tabpanel">
          <form id="customer-login-form" onsubmit="AuthPage.handleLogin(event)">
            <div class="mb-3">
              <label class="form-label small fw-bold">Email or Username</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                <input type="text" id="login-email" class="form-control" required placeholder="customer@mymart.com">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                <input type="password" id="login-password" class="form-control" required placeholder="••••••••">
              </div>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 justify-content-center py-2 mb-3" id="btn-login-submit">
              Sign In to MYMART
            </button>
          </form>


          <div class="text-center small text-muted">
            Are you a store manager? <a href="admin-login.html" class="fw-bold text-success">Admin Login <i class="bi bi-arrow-right"></i></a>
          </div>
        </div>

        <!-- Register Form Pane -->
        <div class="tab-pane fade" id="register-pane" role="tabpanel">
          <form id="customer-register-form" onsubmit="AuthPage.handleRegister(event)">
            <div class="mb-3">
              <label class="form-label small fw-bold">Full Name *</label>
              <input type="text" id="reg-name" class="form-control" required placeholder="John Doe">
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Username *</label>
              <input type="text" id="reg-username" class="form-control" required minlength="3" placeholder="johndoe">
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Email Address *</label>
              <input type="email" id="reg-email" class="form-control" required placeholder="john@example.com">
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Mobile Phone (Optional)</label>
              <input type="tel" id="reg-phone" class="form-control" placeholder="9876543210">
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Password (min 6 characters) *</label>
              <input type="password" id="reg-password" class="form-control" required minlength="6" placeholder="••••••••">
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Confirm Password *</label>
              <input type="password" id="reg-confirm-password" class="form-control" required minlength="6" placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 justify-content-center py-2 mb-2" id="btn-register-submit">
              Create Customer Account
            </button>
          </form>
        </div>
      </div>
    </div>

    <div class="text-center mt-4 small text-muted">
      <a href="index.html" class="text-muted"><i class="bi bi-arrow-left me-1"></i> Back to Homepage</a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/ui.js"></script>

  <script>
    const AuthPage = {
      async handleLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('btn-login-submit');
        btn.disabled = true;
        btn.textContent = 'Signing in...';

        const email = document.getElementById('login-email').value.trim();
        const pass = document.getElementById('login-password').value;

        try {
          await Auth.login(email, pass);
          UI.showToast('Login successful! Welcome to MYMART.', 'success');

          const params = new URLSearchParams(window.location.search);
          const redirect = params.get('redirect') || 'index.html';
          setTimeout(() => window.location.href = redirect, 500);
        } catch (err) {
          UI.showToast(err.message, 'error');
          btn.disabled = false;
          btn.textContent = 'Sign In to MYMART';
        }
      },

      async handleRegister(e) {
        e.preventDefault();
        const pass = document.getElementById('reg-password').value;
        const confirmPass = document.getElementById('reg-confirm-password').value;

        if (pass !== confirmPass) {
          UI.showToast('Passwords do not match', 'error');
          return;
        }

        const btn = document.getElementById('btn-register-submit');
        btn.disabled = true;
        btn.textContent = 'Creating account...';

        const data = {
          fullName: document.getElementById('reg-name').value.trim(),
          username: document.getElementById('reg-username').value.trim(),
          email: document.getElementById('reg-email').value.trim(),
          phone: document.getElementById('reg-phone').value.trim(),
          password: pass
        };

        try {
          await Auth.register(data);
          UI.showToast('Registration successful! Welcome.', 'success');
          setTimeout(() => window.location.href = 'index.html', 500);
        } catch (err) {
          UI.showToast(err.message, 'error');
          btn.disabled = false;
          btn.textContent = 'Create Customer Account';
        }
      }
    };
  </script>
</body>
</html>
