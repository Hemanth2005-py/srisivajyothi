<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Profile — MYMART</title>
  <meta name="description" content="Manage your customer account and contact information.">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom Design System -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Dynamic Navigation Bar Placeholder -->
  <div id="navbar-placeholder"></div>

  <main class="container py-4" style="max-width: 800px;">
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb mb-2 small text-muted">
        <li class="breadcrumb-item"><a href="index.html" class="text-muted">Home</a></li>
        <li class="breadcrumb-item active" aria-current="page">Profile</li>
      </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h3 fw-bold mb-0"><i class="bi bi-person-circle text-success me-2"></i>My Profile & Account</h1>
      <button class="btn btn-outline-danger btn-sm" onclick="Auth.logout()">
        <i class="bi bi-box-arrow-right me-1"></i> Sign Out
      </button>
    </div>

    <!-- Profile Overview Card -->
    <div class="card border-0 rounded-4 shadow-sm mb-4" style="background: var(--bg-surface); border: 1px solid var(--border-color) !important;">
      <div class="card-body p-4 d-flex flex-wrap align-items-center gap-4">
        <div style="width: 80px; height: 80px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: bold;">
          <i class="bi bi-person-fill"></i>
        </div>
        <div class="flex-grow-1">
          <h4 class="fw-bold mb-1" id="profile-display-name">Customer Name</h4>
          <div class="text-muted small mb-2" id="profile-display-email">customer@example.com</div>
          <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-1" id="profile-role-badge">Verified Customer</span>
        </div>
      </div>
    </div>

    <!-- Edit Profile Form -->
    <div class="card border-0 rounded-4 shadow-sm mb-4" style="background: var(--bg-surface); border: 1px solid var(--border-color) !important;">
      <div class="card-header bg-transparent border-bottom p-3">
        <h5 class="fw-bold mb-0">Personal Information</h5>
      </div>
      <div class="card-body p-4">
        <form id="profile-form" onsubmit="ProfileView.saveProfile(event)">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label small fw-bold">Full Name *</label>
              <input type="text" id="prof-name" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">Username</label>
              <input type="text" id="prof-username" class="form-control" disabled readonly>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">Registered Email</label>
              <input type="email" id="prof-email" class="form-control" disabled readonly>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">Contact Phone Number</label>
              <input type="tel" id="prof-phone" class="form-control" pattern="[0-9]{10}" placeholder="9876543210">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">Member Since</label>
              <input type="text" id="prof-created" class="form-control" disabled readonly>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">Last Successful Login</label>
              <input type="text" id="prof-last-login" class="form-control" disabled readonly>
            </div>
          </div>

          <div class="mt-4 text-end">
            <button type="submit" class="btn btn-primary-custom px-4" id="btn-save-profile">
              <i class="bi bi-check2-circle me-1"></i> Save Changes
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Quick Navigation Links -->
    <div class="row g-3">
      <div class="col-md-4">
        <a href="order-history.html" class="card border-0 rounded-4 shadow-sm text-decoration-none p-3 h-100" style="background: var(--bg-surface); border: 1px solid var(--border-color) !important;">
          <div class="d-flex align-items-center gap-3">
            <i class="bi bi-bag-check-fill text-success fs-2"></i>
            <div>
              <div class="fw-bold text-dark">Order History</div>
              <div class="text-muted small">View & download bills</div>
            </div>
          </div>
        </a>
      </div>
      <div class="col-md-4">
        <a href="favorites.html" class="card border-0 rounded-4 shadow-sm text-decoration-none p-3 h-100" style="background: var(--bg-surface); border: 1px solid var(--border-color) !important;">
          <div class="d-flex align-items-center gap-3">
            <i class="bi bi-heart-fill text-danger fs-2"></i>
            <div>
              <div class="fw-bold text-dark">Favorites</div>
              <div class="text-muted small">Your saved products</div>
            </div>
          </div>
        </a>
      </div>
      <div class="col-md-4">
        <a href="cart.html" class="card border-0 rounded-4 shadow-sm text-decoration-none p-3 h-100" style="background: var(--bg-surface); border: 1px solid var(--border-color) !important;">
          <div class="d-flex align-items-center gap-3">
            <i class="bi bi-cart3 text-primary fs-2"></i>
            <div>
              <div class="fw-bold text-dark">Shopping Cart</div>
              <div class="text-muted small">Manage items & checkout</div>
            </div>
          </div>
        </a>
      </div>
    </div>
  </main>

  <!-- Dynamic Footer Placeholder -->
  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/ui.js"></script>

  <script>
    const ProfileView = {
      async init() {
        UI.renderNavbar();
        UI.renderFooter();

        if (!Auth.requireAuth('profile.html')) return;

        try {
          const user = await API.get('/users/me');
          this.populate(user);
        } catch (e) {
          const localUser = Auth.getUser();
          if (localUser) this.populate(localUser);
        }
      },

      populate(user) {
        document.getElementById('profile-display-name').textContent = user.fullName || 'User';
        document.getElementById('profile-display-email').textContent = user.email || '';
        document.getElementById('profile-role-badge').textContent = user.role === 'ROLE_ADMIN' ? 'Administrator' : 'Customer Account';

        document.getElementById('prof-name').value = user.fullName || '';
        document.getElementById('prof-username').value = user.username || '';
        document.getElementById('prof-email').value = user.email || '';
        document.getElementById('prof-phone').value = user.phone || '';

        const createdDate = user.createdAt ? new Date(user.createdAt).toLocaleDateString() : 'Active';
        const loginDate = user.lastLoginAt ? new Date(user.lastLoginAt).toLocaleString() : 'Just now';
        document.getElementById('prof-created').value = createdDate;
        document.getElementById('prof-last-login').value = loginDate;
      },

      async saveProfile(e) {
        e.preventDefault();
        const btn = document.getElementById('btn-save-profile');
        btn.disabled = true;

        const fullName = document.getElementById('prof-name').value.trim();
        const phone = document.getElementById('prof-phone').value.trim();

        try {
          const updated = await API.put('/users/me', { fullName, phone });
          Auth.setSession(Auth.getToken(), updated);
          this.populate(updated);
          UI.showToast('Profile updated successfully', 'success');
        } catch (err) {
          UI.showToast(err.message, 'error');
        } finally {
          btn.disabled = false;
        }
      }
    };

    document.addEventListener('DOMContentLoaded', () => ProfileView.init());
  </script>
</body>
</html>
