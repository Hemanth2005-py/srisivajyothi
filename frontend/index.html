<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYMART — Supermarket Groceries Delivered in 10 Minutes</title>
  <meta name="description" content="Shop groceries, fresh fruits & vegetables, milk, dairy, atta, rice, and snacks online from MYMART. Superfast 10-minute delivery.">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom Design System -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Dynamic Navigation Bar Placeholder -->
  <div id="navbar-placeholder"></div>

  <main class="container py-4">
    <!-- Shop by Category Section -->
    <section class="mb-5">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="fw-bold mb-0 fs-5"><i class="bi bi-grid-fill text-success me-2"></i>Shop by Category</h3>
        <a href="products.html" class="text-success fw-bold text-decoration-none small">See All Categories <i class="bi bi-chevron-right"></i></a>
      </div>
      <div class="row row-cols-3 row-cols-sm-4 row-cols-md-6 row-cols-lg-8 g-3" id="categories-container">
        <!-- Skeleton Categories -->
        <div class="col"><div class="skeleton" style="height: 110px; border-radius: 12px;"></div></div>
        <div class="col"><div class="skeleton" style="height: 110px; border-radius: 12px;"></div></div>
        <div class="col"><div class="skeleton" style="height: 110px; border-radius: 12px;"></div></div>
        <div class="col"><div class="skeleton" style="height: 110px; border-radius: 12px;"></div></div>
        <div class="col"><div class="skeleton" style="height: 110px; border-radius: 12px;"></div></div>
        <div class="col"><div class="skeleton" style="height: 110px; border-radius: 12px;"></div></div>
      </div>
    </section>

    <!-- Bestselling Products Section -->
    <section class="mb-5">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h3 class="fw-bold mb-0 fs-5"><i class="bi bi-fire text-danger me-2"></i>Best-Selling Products</h3>
          <p class="text-muted small mb-0">Most loved grocery items ordered right now</p>
        </div>
        <a href="products.html?sort=popular" class="text-success fw-bold text-decoration-none small">View All <i class="bi bi-chevron-right"></i></a>
      </div>
      <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-3" id="bestsellers-container">
        <!-- Skeleton Cards -->
        <div class="col"><div class="skeleton" style="height: 290px; border-radius: 18px;"></div></div>
        <div class="col"><div class="skeleton" style="height: 290px; border-radius: 18px;"></div></div>
        <div class="col"><div class="skeleton" style="height: 290px; border-radius: 18px;"></div></div>
        <div class="col"><div class="skeleton" style="height: 290px; border-radius: 18px;"></div></div>
        <div class="col"><div class="skeleton" style="height: 290px; border-radius: 18px;"></div></div>
        <div class="col"><div class="skeleton" style="height: 290px; border-radius: 18px;"></div></div>
      </div>
    </section>

    <!-- Featured Discount Offers -->
    <section class="mb-5">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h3 class="fw-bold mb-0 fs-5"><i class="bi bi-stars text-warning me-2"></i>Featured Supermarket Offers</h3>
          <p class="text-muted small mb-0">Handpicked items with highest discounts today</p>
        </div>
        <a href="products.html?discountOnly=true" class="text-success fw-bold text-decoration-none small">View All Deals <i class="bi bi-chevron-right"></i></a>
      </div>
      <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-3" id="featured-container">
        <!-- Skeleton Cards -->
        <div class="col"><div class="skeleton" style="height: 290px; border-radius: 18px;"></div></div>
        <div class="col"><div class="skeleton" style="height: 290px; border-radius: 18px;"></div></div>
        <div class="col"><div class="skeleton" style="height: 290px; border-radius: 18px;"></div></div>
        <div class="col"><div class="skeleton" style="height: 290px; border-radius: 18px;"></div></div>
      </div>
    </section>
  </main>

  <!-- Dynamic Footer Placeholder -->
  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/ui.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      UI.renderNavbar('home');
      UI.renderFooter();

      // Load Categories
      try {
        const categories = await API.get('/categories');
        const catBox = document.getElementById('categories-container');
        if (categories && categories.length > 0) {
          catBox.innerHTML = categories.map(cat => `
            <div class="col">
              <a href="products.html?categoryId=${cat.id}" class="text-decoration-none">
                <div class="category-card">
                  <img src="${cat.imageUrl || 'https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=200&q=80'}"
                       alt="${cat.name}"
                       class="category-img"
                       onerror="this.src='https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=200&q=80'">
                  <span class="category-name">${cat.name}</span>
                </div>
              </a>
            </div>
          `).join('');
        }
      } catch (e) {
        console.error('Failed to load categories', e);
      }

      // Load Bestsellers
      try {
        const bestsellers = await API.get('/products/bestsellers');
        const bsBox = document.getElementById('bestsellers-container');
        if (bestsellers && bestsellers.length > 0) {
          bsBox.innerHTML = bestsellers.slice(0, 6).map(p => `
            <div class="col">
              ${UI.renderProductCard(p)}
            </div>
          `).join('');
        } else {
          bsBox.innerHTML = `<div class="col-12 text-muted">No bestsellers available currently.</div>`;
        }
      } catch (e) {
        console.error('Failed to load bestsellers', e);
      }

      // Load Featured Deals
      try {
        const featured = await API.get('/products/featured');
        const ftBox = document.getElementById('featured-container');
        if (featured && featured.length > 0) {
          ftBox.innerHTML = featured.slice(0, 6).map(p => `
            <div class="col">
              ${UI.renderProductCard(p)}
            </div>
          `).join('');
        } else {
          ftBox.innerHTML = `<div class="col-12 text-muted">No featured offers today.</div>`;
        }
      } catch (e) {
        console.error('Failed to load featured products', e);
      }
    });

    // Re-render card buttons on cart update
    window.addEventListener('cart-updated', () => {
      document.querySelectorAll('.product-card').forEach(card => {
        const pid = card.getAttribute('data-product-id');
        if (pid) UI.refreshProductCardButton(pid);
      });
    });
  </script>
</body>
</html>
