<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand Management — MYMART Admin</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom Design System -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Admin Sidebar -->
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="brand-logo mb-4 px-2">
      <span style="display:inline-flex; width:34px; height:34px; border-radius:10px; background:#0c831f; color:#fff; align-items:center; justify-content:center; font-size:1.1rem;">
        <i class="bi bi-shield-lock-fill"></i>
      </span>
      <span>MYMART</span>
      <span class="badge bg-danger ms-auto" style="font-size:0.65rem;">ADMIN</span>
    </div>

    <nav class="d-flex flex-column gap-1 flex-grow-1">
      <a href="admin-dashboard.html" class="admin-nav-item"><i class="bi bi-speedometer2"></i> Overview</a>
      <a href="admin-products.html" class="admin-nav-item"><i class="bi bi-box-seam"></i> Products Catalog</a>
      <a href="admin-categories.html" class="admin-nav-item"><i class="bi bi-tags"></i> Categories</a>
      <a href="admin-brands.html" class="admin-nav-item active"><i class="bi bi-patch-check"></i> Brands</a>
      <a href="admin-orders.html" class="admin-nav-item"><i class="bi bi-receipt"></i> Orders Management</a>
      <a href="admin-inventory.html" class="admin-nav-item"><i class="bi bi-boxes"></i> Inventory Stock</a>
      <a href="admin-reports.html" class="admin-nav-item"><i class="bi bi-file-earmark-bar-graph"></i> Reports & Downloads</a>
      <a href="index.html" class="admin-nav-item text-primary"><i class="bi bi-shop"></i> View Live Store</a>
    </nav>

    <div class="pt-3 border-top">
      <div class="d-flex align-items-center justify-content-between px-2 mb-2">
        <small class="text-muted">Night Theme</small>
        <button class="btn btn-sm btn-link p-0 text-muted" onclick="UI.toggleTheme()" title="Toggle Dark/Light Mode"><i class="theme-toggle-icon bi bi-moon-stars-fill fs-5"></i></button>
      </div>
      <button class="btn btn-outline-danger btn-sm w-100" onclick="Auth.logout()"><i class="bi bi-box-arrow-right me-1"></i> Sign Out</button>
    </div>
  </aside>

  <!-- Admin Main Content -->
  <div class="admin-main-content">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
      <div>
        <h2 class="h4 fw-bold mb-0">Supermarket Brands</h2>
        <small class="text-muted">Manage supplier brands, logos, and catalog filtering</small>
      </div>
      <button class="btn btn-primary-custom" onclick="AdminBrands.openAddModal()">
        <i class="bi bi-plus-lg me-1"></i> Add Brand
      </button>
    </div>

    <!-- Brands Table -->
    <div class="custom-table-container">
      <div class="table-responsive">
        <table class="table custom-table mb-0">
          <thead>
            <tr>
              <th>Logo</th>
              <th>Brand Name</th>
              <th>Description</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="brands-tbody">
            <tr><td colspan="5" class="text-center py-4 text-muted">Loading brands...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Brand Modal -->
  <div class="modal fade" id="brandModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow rounded-4" style="background: var(--bg-surface);">
        <div class="modal-header border-bottom p-3">
          <h5 class="modal-title fw-bold" id="brandModalTitle">Add Brand</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <form id="brand-form" onsubmit="AdminBrands.saveBrand(event)">
            <input type="hidden" id="edit-brand-id">

            <div class="mb-3">
              <label class="form-label small fw-bold">Brand Name *</label>
              <input type="text" id="brand-name" class="form-control" required placeholder="e.g. Amul, Tata, Nestle">
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Description</label>
              <textarea id="brand-desc" class="form-control" rows="2" placeholder="Brand overview"></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Logo URL</label>
              <input type="url" id="brand-logo" class="form-control" placeholder="https://images.unsplash.com/...">
            </div>

            <div class="form-check form-switch mb-3">
              <input class="form-check-input" type="checkbox" id="brand-active" checked>
              <label class="form-check-label small" for="brand-active">Active</label>
            </div>

            <div class="text-end">
              <button type="button" class="btn btn-outline-secondary me-2" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary-custom">Save</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>

  <script>
    const AdminBrands = {
      brands: [],

      async init() {
        UI.initTheme();
        if (!Auth.requireAdmin()) return;
        await this.load();
      },

      async load() {
        try {
          this.brands = await API.get('/admin/brands');
          const tbody = document.getElementById('brands-tbody');
          if (this.brands.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted">No brands created yet.</td></tr>`;
            return;
          }

          tbody.innerHTML = this.brands.map(b => `
            <tr>
              <td>
                <img src="${b.logoUrl || 'https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=100&q=80'}"
                     style="width: 44px; height: 44px; object-fit: contain; border-radius: 8px; background: var(--bg-subtle);">
              </td>
              <td class="fw-bold">${b.name}</td>
              <td class="text-muted small">${b.description || '-'}</td>
              <td><span class="badge ${b.active ? 'bg-success' : 'bg-secondary'}">${b.active ? 'Active' : 'Inactive'}</span></td>
              <td>
                <button class="btn btn-sm btn-outline-primary me-1" onclick="AdminBrands.openEditModal('${b.id}')"><i class="bi bi-pencil"></i></button>
                <button class="btn btn-sm btn-outline-danger" onclick="AdminBrands.deleteBrand('${b.id}')"><i class="bi bi-trash"></i></button>
              </td>
            </tr>
          `).join('');
        } catch (err) {
          console.error(err);
        }
      },

      openAddModal() {
        document.getElementById('brandModalTitle').textContent = 'Add Brand';
        document.getElementById('edit-brand-id').value = '';
        document.getElementById('brand-form').reset();
        new bootstrap.Modal(document.getElementById('brandModal')).show();
      },

      openEditModal(id) {
        const b = this.brands.find(x => x.id === id);
        if (!b) return;

        document.getElementById('brandModalTitle').textContent = 'Edit Brand';
        document.getElementById('edit-brand-id').value = b.id;
        document.getElementById('brand-name').value = b.name;
        document.getElementById('brand-desc').value = b.description || '';
        document.getElementById('brand-logo').value = b.logoUrl || '';
        document.getElementById('brand-active').checked = b.active;
        new bootstrap.Modal(document.getElementById('brandModal')).show();
      },

      async saveBrand(e) {
        e.preventDefault();
        const id = document.getElementById('edit-brand-id').value;
        const data = {
          name: document.getElementById('brand-name').value.trim(),
          description: document.getElementById('brand-desc').value.trim(),
          logoUrl: document.getElementById('brand-logo').value.trim(),
          active: document.getElementById('brand-active').checked
        };

        try {
          if (id) {
            await API.put(`/admin/brands/${id}`, data);
            UI.showToast('Brand updated', 'success');
          } else {
            await API.post('/admin/brands', data);
            UI.showToast('Brand created', 'success');
          }
          bootstrap.Modal.getInstance(document.getElementById('brandModal')).hide();
          await this.load();
        } catch (err) {
          UI.showToast(err.message, 'error');
        }
      },

      async deleteBrand(id) {
        if (confirm('Delete or deactivate this brand?')) {
          try {
            await API.delete(`/admin/brands/${id}`);
            UI.showToast('Brand updated', 'info');
            await this.load();
          } catch (err) {
            UI.showToast(err.message, 'error');
          }
        }
      }
    };

    document.addEventListener('DOMContentLoaded', () => AdminBrands.init());
  </script>
</body>
</html>
